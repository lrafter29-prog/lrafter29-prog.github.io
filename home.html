<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History Project - Q&A Template</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1>History Project</h1>
    </header>

    <main class="container">
      <ol id="qaContainer" class="qa-list"></ol>
    </main>

    <footer>
      <p>Made by Le'a</p>
    </footer>

    <script>
      const qaContainer = document.getElementById("qaContainer");

      const questions = [
        {
          question: "Where did you grow up?",
          answer:
            "Tracy, California, it was a small town in the middle of California. My Dad wanted to move us out of Oakland, because it was starting to have a lot of violence.",
        },
        {
          question: "What does “stereotype” mean to you?",
          answer:
            "Stereotype means making an assumption about someone else based on how they dress,look, work, religion, sex, age, color, etc. Stereotype does not always have to be bad. It can be positive comments or thoughts as well.",
        },
        {
          question: "When did you first learn about racism or prejudice?",
          answer:
            "it must have been in elementary school because we learned about slavery.",
        },
        {
          question: "Have you ever been stereotyped?",
          answer:
            "Yes, for my race and religion. I have dark colored skin and so people would make comments about the color of my skin. And we were avid Jehovah's Witnesses and they would make comments about the Bible.",
        },
        {
          question: "What stereotype have you heard about your culture?",
          answer:
            "Being that I am Hawaiian and Filipino, it was assumed we know how to dance the hula, surf and make really good food!",
        },
        {
          question: "Has anyone assumed something about you that wasn’t true?",
          answer:
            "Yes, but not in a bad way. As an adult, people assumed I have lived in Hawaii my whole life because I'm Hawaiian",
        },
        {
          question: "How did you react when that happened?",
          answer: "It didn’t hurt my feelings so I would just correct them.",
        },
        {
          question: "Have you seen someone else experience stereotypes?",
          answer: "Yes, unfortunately and I felt very sad for them.",
        },
        {
          question: "Have you ever felt judged because of your background?",
          answer:
            "Not really, I was really proud of who I was and where my parents came from. It made me different. Except for the religious part, I was self-conscious because we couldn’t celebrate any holidays, birthdays, play school sports or go to any school events. ",
        },
        {
          question: "Have you experienced prejudice at school or work?",
          answer:
            "One time at work I felt like I experience prejudice at work by a man who was trying to make me feel like I didn’t know anything because I was a female. He treated me like a little girl and I didn’t like it!",
        },
        {
          question: "Have you ever experienced racism directly?",
          answer: "No, I have not.",
        },
        {
          question: "Where do you think people learn stereotypes from?",
          answer:
            "They are taught it from a young age from witnessing how other people react to others. They basically mimic what the adults around them do. Stereotypes will vary depending on where you live.",
        },
        {
          question: "How do media or social media influence stereotypes?",
          answer:
            "Social media portrays what some would think is a “perfect life” and the world gets bombarded with these expectations thereby putting people in different categories (stereotyping) depending on whether or not they meet social media expectations.",
        },
        {
          question: "Why do you think some stereotypes continue over time?",
          answer:
            "Because we are constantly bombarded by expectations, it’s easier for our brain to make shortcuts. It is mentally cheaper to put someone into a pre-existing box than to evaluate them as a unique individual.",
        },
        {
          question: "How can people question or unlearn stereotypes?",
          answer:
            "We have to be conscious of our thoughts. When we meet someone we have to “Pause” and make sure we are not judging them based on looks. When we catch ourselves stereotyping people, we need to rewind our brain and ask, is this true? What else do I see in this person other than what immediately pops up? And above all, have a kind heart.",
        },
        {
          question: "Do you think stereotypes are common today?",
          answer:
            "yes, even more so with social media and the pressure we have to keep up with current trends.",
        },
        {
          question: "Do you think things were different when you were younger?",
          answer:
            "yes, because of social media. When something happened, we didn't have a means to record it for everyone to see and there is more expectations for people to look a certain way and have material things.",
        },
        {
          question:
            "What stereotypes do people often believe that aren’t true?",
          answer:
            "I think people are judged by the way they dress, what they drive, skin color or job and people make quick decisions about whether or not they are smart, rich, poor. ",
        },
        {
          question: "How do stereotypes affect people’s lives?",
          answer:
            "People can feel self conscious if they feel they are being judged and it affects the way they present themselves. However a very confident person would not care what people thought of them.",
        },
        {
          question: "Do you think prejudice still exists?",
          answer:
            "Yes, because we are imperfect and it's easy to make assumptions without knowing the truth. And it’s easy to pre-judge someone. ",
        },
        {
          question: "How can people challenge stereotypes?",
          answer:
            "By speaking up for themselves or being confident and not letting what other people think of them affect them. ",
        },
        {
          question: "What should schools teach about racism?",
          answer:
            "That all humans are the same regardless of our physical or life differences. ",
        },
        {
          question: "What should parents teach kids about fairness?",
          answer: "",
        },
        { question: "How can communities reduce prejudice?", answer: "" },
        {
          question:
            "What advice would you give young people about respecting others?",
          answer: "",
        },
      ];

      questions.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = "qa-card";
        li.innerHTML = `
          <label>
            ${item.question}
            <textarea class="qa-answer" rows="3" readonly>${item.answer}</textarea>
          </label>
        `;
        qaContainer.appendChild(li);
      });

      function revealCards() {
        document.querySelectorAll(".qa-card").forEach((card, index) => {
          setTimeout(() => card.classList.add("visible"), index * 60);
        });
      }

      window.addEventListener("DOMContentLoaded", revealCards);
      window.addEventListener("scroll", () => {
        document.querySelectorAll(".qa-card").forEach((card) => {
          const rect = card.getBoundingClientRect();
          if (rect.top < window.innerHeight - 120) {
            card.classList.add("visible");
          }
        });
      });
    </script>
  </body>
</html>
